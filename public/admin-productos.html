<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Administración de Productos
    </title>

    <link
        href="Library/bootstrap-4.6.0-dist/css/bootstrap.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="estilos/admin-pedidos.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            🍾 Licores La 79
        </div>

        <nav>

            <a
                href="admin-dashboard.html"
                class="menu-item">

                📊 Dashboard

            </a>

            <a
                href="admin-pedidos.html"
                class="menu-item">

                📦 Pedidos

            </a>

            <a
                href="admin-productos.html"
                class="menu-item activo">

                🍾 Productos

            </a>

            <a
                href="#"
                class="menu-item">

                📂 Categorías

            </a>

            <a
                href="#"
                class="menu-item">

                👥 Clientes

            </a>

            <a
                href="#"
                class="menu-item">

                📈 Reportes

            </a>

        </nav>

    </aside>

    <main class="contenido-admin">

        <div
            class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="titulo mb-0">
                Gestión de Productos
            </h2>

            <button
                class="btn btn-warning"
                id="btnNuevoProducto">

                + Nuevo Producto

            </button>

        </div>

        <div class="contenedor-busqueda">

            <input
                type="text"
                id="buscarProducto"
                class="buscador-estados"
                placeholder="Buscar producto...">

        </div>

        <div class="table-responsive">

            <table
                class="table table-dark table-hover">

                <thead>

                    <tr>

                        <th>Imagen</th>

                        <th>Nombre</th>

                        <th>SKU</th>

                        <th>Categoría</th>

                        <th>Stock</th>

                        <th>Precio</th>

                        <th>Estado</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaProductos">

                    <tr>

                        <td colspan="8"
                            class="text-center">

                            Cargando productos...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="Library/jquery-3.6.0.js"></script>

<script src="Library/bootstrap-4.6.0-dist/js/bootstrap.js"></script>

<script src="js/admin-productos.js"></script>

</body>

</html>
