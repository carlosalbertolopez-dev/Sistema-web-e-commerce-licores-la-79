<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Pedidos</title>

    <link href="Library/bootstrap-4.6.0-dist/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/admin-pedidos.css">
</head>

<body>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="titulo mb-1">
                Gestión de Pedidos
            </h2>

            <div class="panel-actualizacion">

                <div class="ultima-actualizacion">
                    Última actualización:
                    <span id="ultimaActualizacion">
                        --
                    </span>
                </div>
            
                <button
                    id="btnActualizar"
                    class="btn-actualizar-panel">
                    ↻ Actualizar
                </button>
            
            </div>

            <div
    class="dashboard-grid"
    id="dashboardAdmin">

</div>

            <p class="text-muted mb-0">
                Administra los pedidos realizados en Licores La 79
            </p>

        </div>

    </div>

    <div class="mb-4">

        <div class="contenedor-busqueda">
            <input
                type="text"
                id="filtroEstado"
                class="buscador-estados"
                placeholder="Buscar por N° pedido, cliente, correo o estado">
        </div>
    

    <div id="contenedorPedidos">

        <div class="text-center">
            Cargando pedidos...
        </div>

    </div>

    <div
    id="toastExito"
    class="toast-admin toast-exito">
     Estado actualizado correctamente
</div>

<div
    id="toastError"
    class="toast-admin toast-error">
     No fue posible actualizar el estado
</div>

    <div
        class="modal fade"
        id="modalEstado"
        tabindex="-1">

        <div
            class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title text-warning">
                        Confirmar Cambio
                    </h5>

                    <button
                        type="button"
                        class="close text-white"
                        data-dismiss="modal">

                        <span>&times;</span>

                    </button>

                </div>

                <div class="modal-body">

                    <p id="textoConfirmacion"></p>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        type="button"
                        class="btn btn-warning"
                        id="btnConfirmarEstado">

                        Confirmar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <div
    class="modal fade"
    id="modalDetallePedido"
    tabindex="-1">

    <div
        class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title text-warning">

                    Detalle del Pedido

                </h5>

                <button
                    type="button"
                    class="close text-white"
                    data-dismiss="modal">

                    <span>&times;</span>

                </button>

            </div>

            <div class="modal-body">

                <div class="table-responsive">

                    <table
                        class="table table-dark">

                        <thead>

                            <tr>

                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio</th>
                                <th>Subtotal</th>

                            </tr>

                        </thead>

                        <tbody
                            id="detallePedidoBody">

                        </tbody>

                    </table>

                </div>

                <hr>

                <h4
                    class="text-warning text-right">

                    Total:
                    <span
                        id="totalPedidoDetalle">

                    </span>

                </h4>

            </div>

        </div>

    </div>

</div>

    <script src="Library/jquery-3.6.0.js"></script>
    <script src="Library/bootstrap-4.6.0-dist/js/bootstrap.js"></script>
    <script src="js/admin-pedidos.js"></script>

</body>

</html>
